<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fase de Grupos — Quiniela Mundial 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --gold:#F5C518; --red:#C1121F; --dark:#0A0A0F; --dark2:#111118;
    --dark3:#1A1A25; --white:#F8F8F2; --gray:#9999AA; --green:#2ECC71;
  }
  *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--dark); color:var(--white); font-family:'Barlow',sans-serif; min-height:100vh; }
  .container { max-width:860px; margin:0 auto; padding:0 16px 60px; }

  /* HERO */
  .hero { text-align:center; padding:44px 0 32px; }
  .hero-badge { display:inline-block; background:var(--red); color:var(--white); font-family:'Bebas Neue',cursive; font-size:12px; letter-spacing:4px; padding:5px 16px; border-radius:2px; margin-bottom:14px; }
  .hero-title { font-family:'Bebas Neue',cursive; font-size:clamp(44px,10vw,80px); line-height:0.9; }
  .hero-title span { display:block; color:var(--gold); font-size:clamp(18px,4vw,28px); letter-spacing:5px; }
  .hero-line { width:60px; height:3px; background:linear-gradient(90deg,var(--gold),var(--red)); margin:16px auto 0; }

  /* STATS */
  .stats { display:flex; justify-content:center; gap:24px; margin:24px 0 28px; flex-wrap:wrap; }
  .stat { text-align:center; }
  .stat-n { font-family:'Bebas Neue',cursive; font-size:32px; color:var(--gold); line-height:1; }
  .stat-l { font-family:'Barlow Condensed',sans-serif; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--gray); }

  /* FILTERS */
  .filters { background:var(--dark3); border:1px solid rgba(255,255,255,0.06); border-radius:10px; padding:16px 18px; margin-bottom:20px; }
  .filters-title { font-family:'Barlow Condensed',sans-serif; font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--gray); margin-bottom:12px; }
  .filter-row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .filter-row + .filter-row { margin-top:10px; }

  .filter-label { font-family:'Barlow Condensed',sans-serif; font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--gray); width:60px; flex-shrink:0; }

  .search-input {
    flex:1; min-width:180px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1);
    border-radius:6px; padding:8px 14px; color:var(--white); font-family:'Barlow',sans-serif; font-size:13px;
    outline:none; transition:border-color 0.2s;
  }
  .search-input:focus { border-color:var(--gold); }
  .search-input::placeholder { color:var(--gray); }

  .filter-btns { display:flex; gap:6px; flex-wrap:wrap; }

  .fbtn {
    font-family:'Barlow Condensed',sans-serif; font-size:12px; font-weight:600; letter-spacing:1px;
    text-transform:uppercase; padding:6px 14px; border-radius:20px; cursor:pointer; border:1px solid;
    transition:all 0.2s; background:transparent; color:var(--gray); border-color:rgba(255,255,255,0.12);
  }
  .fbtn:hover { color:var(--white); border-color:rgba(255,255,255,0.3); }
  .fbtn.active { background:var(--gold); color:var(--dark); border-color:var(--gold); }
  .fbtn.active-red { background:var(--red); color:var(--white); border-color:var(--red); }

  .btn-clear { font-family:'Barlow Condensed',sans-serif; font-size:11px; letter-spacing:1px; text-transform:uppercase; padding:6px 14px; border-radius:20px; cursor:pointer; border:1px solid rgba(193,18,31,0.4); background:transparent; color:#FF6B6B; transition:all 0.2s; }
  .btn-clear:hover { background:rgba(193,18,31,0.1); }

  /* RESULTS COUNT */
  .results-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; padding:0 2px; }
  .results-count { font-family:'Barlow Condensed',sans-serif; font-size:13px; color:var(--gray); letter-spacing:1px; }
  .results-count span { color:var(--gold); font-weight:700; }

  /* TABLE */
  .table-wrap { background:var(--dark3); border:1px solid rgba(255,255,255,0.06); border-radius:10px; overflow:hidden; }

  .t-header { display:grid; grid-template-columns:44px 90px 64px 1fr 36px 1fr 90px; padding:10px 16px; background:rgba(245,197,24,0.08); border-bottom:1px solid rgba(245,197,24,0.12); gap:8px; }
  .th { font-family:'Barlow Condensed',sans-serif; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--gold); }
  .th.center { text-align:center; }
  .th.right { text-align:right; }

  .match-row { display:grid; grid-template-columns:44px 90px 64px 1fr 36px 1fr 90px; padding:11px 16px; border-bottom:1px solid rgba(255,255,255,0.04); align-items:center; gap:8px; transition:background 0.15s; }
  .match-row:last-child { border-bottom:none; }
  .match-row:hover { background:rgba(255,255,255,0.02); }
  .match-row.hidden { display:none; }

  .col-num { font-family:'Bebas Neue',cursive; font-size:20px; color:var(--gold); text-align:center; line-height:1; }
  .col-date { font-family:'Barlow Condensed',sans-serif; font-size:12px; color:var(--gray); }
  .col-time { font-family:'Bebas Neue',cursive; font-size:18px; color:var(--white); text-align:center; }
  .col-home { font-family:'Barlow Condensed',sans-serif; font-size:14px; font-weight:700; letter-spacing:0.5px; text-align:right; }
  .col-vs { font-family:'Barlow Condensed',sans-serif; font-size:11px; color:var(--gray); text-align:center; letter-spacing:1px; }
  .col-away { font-family:'Barlow Condensed',sans-serif; font-size:14px; letter-spacing:0.5px; }

  .col-group { text-align:right; }
  .group-badge { display:inline-block; font-family:'Bebas Neue',cursive; font-size:13px; letter-spacing:1px; padding:2px 8px; border-radius:3px; }
  .gA { background:rgba(231,76,60,0.2);   color:#E74C3C; }
  .gB { background:rgba(230,126,34,0.2);  color:#E67E22; }
  .gC { background:rgba(241,196,15,0.2);  color:#F1C40F; }
  .gD { background:rgba(46,204,113,0.2);  color:#2ECC71; }
  .gE { background:rgba(26,188,156,0.2);  color:#1ABC9C; }
  .gF { background:rgba(52,152,219,0.2);  color:#3498DB; }
  .gG { background:rgba(155,89,182,0.2);  color:#9B59B6; }
  .gH { background:rgba(52,73,94,0.4);    color:#BDC3C7; }
  .gI { background:rgba(193,18,31,0.2);   color:#E74C3C; }
  .gJ { background:rgba(245,197,24,0.2);  color:#F5C518; }
  .gK { background:rgba(46,204,113,0.15); color:#27AE60; }
  .gL { background:rgba(52,152,219,0.15); color:#2980B9; }

  .no-results { text-align:center; padding:40px 20px; color:var(--gray); font-family:'Barlow Condensed',sans-serif; font-size:16px; letter-spacing:1px; display:none; }

  /* FOOTER */
  .footer { text-align:center; padding-top:36px; border-top:1px solid rgba(255,255,255,0.06); margin-top:36px; }
  .hero-badge2 { display:inline-block; background:var(--gold); color:var(--dark); font-family:'Bebas Neue',cursive; font-size:13px; letter-spacing:4px; padding:6px 20px; border-radius:2px; }

  @media(max-width:580px) {
    .t-header { grid-template-columns:36px 80px 52px 1fr 28px 1fr 70px; padding:8px 10px; gap:4px; }
    .match-row { grid-template-columns:36px 80px 52px 1fr 28px 1fr 70px; padding:10px 10px; gap:4px; }
    .col-home, .col-away { font-size:12px; }
    .col-date { font-size:10px; }
  }
</style>
</head>

let activeGroup = 'all';
let activeDate  = 'all';
let searchTerm  = '';

function render() {
  const list = document.getElementById('matchList');
  const noRes = document.getElementById('noResults');
  const rows = list.querySelectorAll('.match-row');
  let visible = 0;

  rows.forEach(row => {
    const g = row.dataset.group;
    const d = row.dataset.date;
    const txt = row.dataset.search;

    const matchGroup  = activeGroup === 'all' || g === activeGroup;
    const matchDate   = activeDate  === 'all' || d.includes(activeDate);
    const matchSearch = !searchTerm || txt.includes(searchTerm.toLowerCase());

    if (matchGroup && matchDate && matchSearch) {
      row.classList.remove('hidden');
      visible++;
    } else {
      row.classList.add('hidden');
    }
  });

  document.getElementById('countVisible').textContent = visible;
  noRes.style.display = visible === 0 ? 'block' : 'none';
}

function filterGroup(btn) {
  document.querySelectorAll('#groupFilters .fbtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeGroup = btn.dataset.group;
  render();
}

function filterDate(btn) {
  document.querySelectorAll('#dateFilters .fbtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeDate = btn.dataset.date;
  render();
}

function clearAll() {
  activeGroup = 'all'; activeDate = 'all'; searchTerm = '';
  document.getElementById('searchInput').value = '';
  document.querySelectorAll('.fbtn[data-group]').forEach(b => b.classList.toggle('active', b.dataset.group === 'all'));
  document.querySelectorAll('.fbtn[data-date]').forEach(b => b.classList.toggle('active', b.dataset.date === 'all'));
  render();
}

document.addEventListener('DOMContentLoaded', function() {

  document.getElementById('searchInput').addEventListener('input', function(e) {
    searchTerm = e.target.value.toLowerCase();
    render();
  });

  document.getElementById('btnClear').addEventListener('click', clearAll);
  document.getElementById('btnClear').addEventListener('touchstart', function(e) { e.preventDefault(); clearAll(); });

  document.querySelectorAll('#groupFilters .fbtn').forEach(function(btn) {
    btn.addEventListener('click', function() { filterGroup(this); });
    btn.addEventListener('touchstart', function(e) { e.preventDefault(); filterGroup(this); });
  });

  document.querySelectorAll('#dateFilters .fbtn').forEach(function(btn) {
    btn.addEventListener('click', function() { filterDate(this); });
    btn.addEventListener('touchstart', function(e) { e.preventDefault(); filterDate(this); });
  });

});

// Build rows immediately (before DOMContentLoaded since script is at bottom)
const list = document.getElementById('matchList');
MATCHES.forEach(m => {
  const row = document.createElement('div');
  row.className = 'match-row';
  row.dataset.group  = m.group;
  row.dataset.date   = m.date;
  row.dataset.search = (m.n + ' ' + m.date + ' ' + m.time + ' ' + m.home + ' ' + m.away + ' grupo ' + m.group).toLowerCase();

  row.innerHTML = `
    <div class="col-num">${m.n}</div>
    <div class="col-date">${m.date}</div>
    <div class="col-time">${m.time}</div>
    <div class="col-home">${m.home}</div>
    <div class="col-vs">vs</div>
    <div class="col-away">${m.away}</div>
    <div class="col-group"><span class="group-badge g${m.group}">Grupo ${m.group}</span></div>
  `;
  list.appendChild(row);
});
</script>
</body>
</html>
